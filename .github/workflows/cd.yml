name: CD

# Deploy mechanism: self-hosted Actions runner installed on the Lightsail box.
# Chosen over MSDeploy (requires Web Deploy + a credentialed publish endpoint
# on the host) and OpenSSH/SCP (requires enabling sshd on the Windows box and
# managing key pairs as a repo secret). The runner already has direct
# file-system and IIS access from inside the box, so the workflow needs no
# inbound credentials for the deploy itself. Trade-off accepted: a long-running
# Actions runner service to maintain on the host.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Publish & deploy
    runs-on: [self-hosted, Windows, lightsail]
    timeout-minutes: 20

    env:
      SITE_PATH: C:\Azureflow-QA\GithubSync.API
      BACKUP_ROOT: C:\Azureflow-QA
      APP_POOL: github-sync-api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # SourceRevisionId stamps the commit SHA into AssemblyInformationalVersion at compile
      # time. Sentry reads that attribute as the Release tag for events, so errors are
      # traceable back to the exact deployed commit.
      - name: Publish
        run: dotnet publish src/GithubSync.Api/GithubSync.Api.csproj -c Release -r win-x64 --self-contained false -p:SourceRevisionId=${{ github.sha }} -o publish

      # Generate a self-contained EF Core migration bundle from the same source the publish
      # used. The bundle embeds the migration history as compiled SQL plus a thin runner;
      # at apply time it needs only a connection string, no .NET runtime, no dotnet-ef tool.
      # Hangfire__Enabled=false: HangfireWiring.AddHangfireScheduler throws when the AppDb
      # connection string is blank (which it is in CI), and the bundle build only needs the
      # EF model — Hangfire wiring isn't relevant here.
      - name: Generate EF Core migration bundle
        shell: powershell
        env:
          Hangfire__Enabled: 'false'
        run: |
          dotnet tool restore
          dotnet ef migrations bundle `
            --project src/GithubSync.Data `
            --startup-project src/GithubSync.Api `
            --configuration Release `
            --target-runtime win-x64 `
            --self-contained `
            --output efbundle.exe `
            --force

      - name: Stop app pool
        shell: powershell
        run: |
          Import-Module WebAdministration
          if ((Get-WebAppPoolState -Name $env:APP_POOL).Value -ne 'Stopped') {
            Stop-WebAppPool -Name $env:APP_POOL
          }
          $deadline = (Get-Date).AddSeconds(30)
          while ((Get-WebAppPoolState -Name $env:APP_POOL).Value -ne 'Stopped' -and (Get-Date) -lt $deadline) {
            Start-Sleep -Milliseconds 500
          }
          if ((Get-WebAppPoolState -Name $env:APP_POOL).Value -ne 'Stopped') {
            throw "App pool '$env:APP_POOL' did not stop within 30s."
          }

      # Apply pending migrations after the pool is stopped (no in-flight queries against an
      # about-to-change schema) and BEFORE rotating the backup folder. If the bundle fails,
      # the previous publish directory is still in place and the `if: always()` Start app pool
      # at the end can bring the old code back up. EF Core wraps each migration in a
      # transaction, so a partial failure leaves the failing migration rolled back and the
      # next deploy resumes from there.
      - name: Apply EF Core migrations
        shell: powershell
        env:
          APP_DB_CONNECTION_STRING: ${{ secrets.APP_DB_CONNECTION_STRING }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:APP_DB_CONNECTION_STRING)) {
            throw "APP_DB_CONNECTION_STRING secret is empty; cannot apply migrations."
          }
          .\efbundle.exe --connection $env:APP_DB_CONNECTION_STRING
          if ($LASTEXITCODE -ne 0) {
            throw "EF Core migration bundle exited with code $LASTEXITCODE."
          }

      - name: Rotate backup
        shell: powershell
        run: |
          Get-ChildItem -Path $env:BACKUP_ROOT -Directory -Filter "GithubSync.API.backup-*" |
            Remove-Item -Recurse -Force
          if (Test-Path $env:SITE_PATH) {
            $stamp = Get-Date -Format 'yyyyMMdd-HHmmss'
            Rename-Item -Path $env:SITE_PATH -NewName "GithubSync.API.backup-$stamp"
          }

      - name: Copy publish output
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path $env:SITE_PATH -Force | Out-Null
          Copy-Item -Path "publish\*" -Destination $env:SITE_PATH -Recurse -Force

      # Re-applies every deploy so a rotated secret takes effect on the next merge
      # to main without anyone touching the host. The app reads these via
      # IConfiguration; the validator in Program.cs fails the worker if any are missing.
      - name: Configure app pool environment variables
        shell: powershell
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          GH_API_TOKEN: ${{ secrets.GH_API_TOKEN }}
          ADO_PAT: ${{ secrets.ADO_PAT }}
          APP_DB_CONNECTION_STRING: ${{ secrets.APP_DB_CONNECTION_STRING }}
        run: |
          $filter = "system.applicationHost/applicationPools/add[@name='$env:APP_POOL']/environmentVariables"

          # Secrets — must be non-empty or the deploy fails before the pool starts.
          $secrets = @(
            @{ Name = 'SENTRY_DSN';                Value = $env:SENTRY_DSN }
            @{ Name = 'GITHUB_TOKEN';              Value = $env:GH_API_TOKEN }
            @{ Name = 'ADO_PAT';                   Value = $env:ADO_PAT }
            @{ Name = 'ConnectionStrings__AppDb';  Value = $env:APP_DB_CONNECTION_STRING }
          )

          $missing = $secrets | Where-Object { [string]::IsNullOrWhiteSpace($_.Value) } | ForEach-Object { $_.Name }
          if ($missing) {
            throw "Missing GitHub Actions secrets for: $($missing -join ', '). Configure them in Settings -> Secrets and variables -> Actions."
          }

          # Non-secret config. Hardcoded here rather than a GitHub Actions variable:
          # the value is operationally fixed (Seq is colocated on the box, loopback
          # only), and keeping it in the workflow keeps the env-var set defined in
          # one place. To disable the Seq sink, comment the SEQ_SERVER_URL line and
          # redeploy — LoggingWiring no-ops on a blank value.
          $config = @(
            @{ Name = 'SEQ_SERVER_URL';            Value = 'http://localhost:5341' }
          )

          $entries = $secrets + $config

          Clear-WebConfiguration -pspath 'MACHINE/WEBROOT/APPHOST' -filter $filter
          foreach ($e in $entries) {
            Add-WebConfigurationProperty -pspath 'MACHINE/WEBROOT/APPHOST' -filter $filter `
              -name '.' -value @{ name = $e.Name; value = $e.Value }
          }

      - name: Start app pool
        if: always()
        shell: powershell
        run: |
          Import-Module WebAdministration
          Start-WebAppPool -Name $env:APP_POOL
